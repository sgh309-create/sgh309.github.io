<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floof Tier List</title>
<style>
:root{--ink:#392b32;--cream:#fff8ee;--pink:#ff8fab;--peach:#ffd6a5;--yellow:#fdffb6;--mint:#caffbf;--blue:#9bf6ff;--lav:#bdb2ff;--line:#eadbd0;--shadow:0 10px 28px rgba(80,45,55,.12)}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff 0 7%,transparent 25%),linear-gradient(135deg,#fff8ee,#fff1f6 50%,#eefcff);min-height:100vh}
header{padding:34px 24px 18px;text-align:center}h1{font-size:clamp(2.2rem,5vw,4.4rem);margin:0;font-weight:900;letter-spacing:-.06em}h1 span{display:inline-block;transform:rotate(-2deg);background:var(--yellow);padding:0 .18em;border-radius:.22em;box-shadow:4px 5px 0 #e9c95c}.sub{margin:14px auto 0;max-width:700px;font-size:1.05rem}
.wrap{width:min(1400px,94vw);margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}.btn{border:2px solid var(--ink);background:white;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:.15s}.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink)}
.board{display:grid;gap:10px;margin-bottom:28px}.tier{display:grid;grid-template-columns:82px 1fr;min-height:126px;background:rgba(255,255,255,.8);border:3px solid white;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.label{display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:1000;border-right:3px solid white}.s{background:#ff8fab}.a{background:#ffd6a5}.b{background:#fdffb6}.c{background:#caffbf}.d{background:#9bf6ff}.f{background:#bdb2ff}.dropzone{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-content:flex-start;min-height:120px}.dropzone.over{background:rgba(255,255,255,.7);outline:4px dashed #ff8fab;outline-offset:-7px}
.bank{background:rgba(255,255,255,.65);border:3px dashed #d9c5bd;border-radius:26px;padding:18px;margin-bottom:40px}.bank-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.bank h2{margin:0;font-size:1.35rem}.count{font-size:.9rem;font-weight:800;opacity:.65}.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}.cat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px;cursor:grab;box-shadow:0 5px 12px rgba(80,45,55,.1);user-select:none;transition:.15s;position:relative}.cat:hover{transform:rotate(-1deg) translateY(-3px);box-shadow:0 10px 18px rgba(80,45,55,.15)}.cat.dragging{opacity:.35;transform:scale(.96)}.cat img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;background:#eee}.name{font-weight:900;margin:8px 3px 1px;font-size:.95rem}.kind{font-size:.72rem;opacity:.6;margin:0 3px 3px}.ranked .cat{width:135px}.ranked .cat img{aspect-ratio:1/1}.ranked .name{font-size:.8rem}
.hint{text-align:center;font-size:.9rem;opacity:.7;margin:-12px 0 22px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:var(--ink);color:white;padding:12px 18px;border-radius:999px;font-weight:800;transition:.25s;z-index:5}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.tier{grid-template-columns:58px 1fr}.label{font-size:2rem}.ranked .cat{width:110px}.cats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>🐾 <span>FLOOF</span> TIER LIST</h1><p class="sub">How fluffy is a cat? You decide. Drag every cat into S, A, B, C, D, or F and build your very own floof hierarchy.</p></header>
<main class="wrap">
<div class="toolbar"><button class="btn" id="shuffle">🔀 Shuffle cats</button><button class="btn" id="reset">↩ Reset board</button><button class="btn" id="random">🎲 Randomize ranking</button></div>
<p class="hint">Tip: drag cats between tiers—or drag them back to the cat bank.</p>
<section class="board" id="board"></section>
<section class="bank"><div class="bank-head"><h2>🐱 The cat bank</h2><div class="count" id="count"></div></div><div class="cats" id="bank"></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const cats=[
["Maine Coon","Domestic","https://loremflickr.com/500/500/mainecoon?lock=1"],
["Persian","Domestic","https://loremflickr.com/500/500/persian,cat?lock=2"],
["Ragdoll","Domestic","https://loremflickr.com/500/500/ragdoll,cat?lock=3"],
["Norwegian Forest Cat","Domestic","https://loremflickr.com/500/500/norwegianforestcat?lock=4"],
["Siberian","Domestic","https://loremflickr.com/500/500/siberiancat?lock=5"],
["British Longhair","Domestic","https://loremflickr.com/500/500/britishlonghair?lock=6"],
["Turkish Angora","Domestic","https://loremflickr.com/500/500/turkishangora?lock=7"],
["Himalayan","Domestic","https://loremflickr.com/500/500/himalayancat?lock=8"],
["Scottish Fold","Domestic","https://loremflickr.com/500/500/scottishfold?lock=9"],
["Birman","Domestic","https://loremflickr.com/500/500/birmancat?lock=10"],
["Somali","Domestic","https://loremflickr.com/500/500/somalicat?lock=11"],
["Balinese","Domestic","https://loremflickr.com/500/500/balinesecat?lock=12"],
["Chinchilla Persian","Domestic","https://loremflickr.com/500/500/chinchillapersian?lock=13"],
["American Bobtail","Domestic","https://loremflickr.com/500/500/americanbobtail?lock=14"],
["LaPerm","Domestic","https://loremflickr.com/500/500/lapermcat?lock=15"],
["Selkirk Rex","Domestic","https://loremflickr.com/500/500/selkirksrex?lock=16"],
["Bengal","Domestic","https://loremflickr.com/500/500/bengalcat?lock=17"],
["Abyssinian","Domestic","https://loremflickr.com/500/500/abyssiniancat?lock=18"],
["Sphynx","Domestic","https://loremflickr.com/500/500/sphynxcat?lock=19"],
["Oriental Shorthair","Domestic","https://loremflickr.com/500/500/orientalshorthair?lock=20"],
["Lynx","Wild","https://loremflickr.com/500/500/lynx?lock=21"],
["Canada Lynx","Wild","https://loremflickr.com/500/500/canadlynx?lock=22"],
["Bobcat","Wild","https://loremflickr.com/500/500/bobcat?lock=23"],
["Caracal","Wild","https://loremflickr.com/500/500/caracal?lock=24"],
["Serval","Wild","https://loremflickr.com/500/500/serval?lock=25"],
["Pallas's Cat","Wild","https://loremflickr.com/500/500/pallascat?lock=26"],
["Sand Cat","Wild","https://loremflickr.com/500/500/sandcat?lock=27"],
["Fishing Cat","Wild","https://loremflickr.com/500/500/fishingcat?lock=28"],
["Clouded Leopard","Wild","https://loremflickr.com/500/500/cloudedleopard?lock=29"],
["Snow Leopard","Wild","https://loremflickr.com/500/500/snowleopard?lock=30"],
["Tiger","Wild","https://loremflickr.com/500/500/tiger?lock=31"],
["Lion","Wild","https://loremflickr.com/500/500/lion?lock=32"],
["Jaguar","Wild","https://loremflickr.com/500/500/jaguar?lock=33"],
["Leopard","Wild","https://loremflickr.com/500/500/leopard?lock=34"],
["Cheetah","Wild","https://loremflickr.com/500/500/cheetah?lock=35"],
["Ocelot","Wild","https://loremflickr.com/500/500/ocelot?lock=36"],
["Margay","Wild","https://loremflickr.com/500/500/margay?lock=37"],
["Red Panda","Wildcard","https://loremflickr.com/500/500/redpanda?lock=38"],
["Fisher","Wildcard","https://loremflickr.com/500/500/fisheranimal?lock=39"],
["Manul","Wild","https://loremflickr.com/500/500/manul?lock=40"]
];
const tiers=[["S","s"],["A","a"],["B","b"],["C","c"],["D","d"],["F","f"]];
const board=document.querySelector("#board"),bank=document.querySelector("#bank"),count=document.querySelector("#count"),toast=document.querySelector("#toast");
let dragged=null;
function card(c){
 const el=document.createElement("article");el.className="cat";el.draggable=true;el.dataset.name=c[0];
 el.innerHTML=`<img src="${c[2]}" alt="${c[0]}" loading="lazy"><div class="name">${c[0]}</div><div class="kind">${c[1]}</div>`;
 el.addEventListener("dragstart",e=>{dragged=el;el.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
 el.addEventListener("dragend",()=>{el.classList.remove("dragging");dragged=null;update()});
 return el;
}
function setup(){
 board.innerHTML="";
 tiers.forEach(([name,cls])=>{
  const row=document.createElement("div");row.className="tier";
  row.innerHTML=`<div class="label ${cls}">${name}</div><div class="dropzone ranked" data-tier="${name}"></div>`;
  board.append(row);
 });
 bank.innerHTML="";cats.forEach(c=>bank.append(card(c)));wireDrops();update();
}
function wireDrops(){
 document.querySelectorAll(".dropzone,.bank").forEach(zone=>{
  zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});
  zone.addEventListener("dragleave",()=>zone.classList.remove("over"));
  zone.addEventListener("drop",e=>{
   e.preventDefault();zone.classList.remove("over");if(!dragged)return;
   zone.append(dragged);toastMsg(zone.classList.contains("bank")?"Back to the cat bank!":"Floof officially ranked!");update();
  });
 });
}
function update(){count.textContent=`${bank.children.length} unranked · ${cats.length-bank.children.length} ranked`;}
function toastMsg(s){toast.textContent=s;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1100)}
function shuffle(){
 const items=[...bank.children];items.sort(()=>Math.random()-.5);items.forEach(x=>bank.append(x));toastMsg("New cat order!");
}
function randomize(){
 const all=[...bank.children];document.querySelectorAll(".ranked .cat").forEach(x=>all.push(x));
 document.querySelectorAll(".ranked").forEach(x=>x.innerHTML="");
 all.sort(()=>Math.random()-.5).forEach((x,i)=>document.querySelectorAll(".ranked")[i%6].append(x));
 update();toastMsg("Chaos ranking deployed 😼");
}
document.querySelector("#shuffle").onclick=shuffle;
document.querySelector("#reset").onclick=()=>{setup();toastMsg("Fresh board!");
};
document.querySelector("#random").onclick=randomize;
setup();
</script>
</body>
</html>
